# ~/.config/hypr/hyprlock.conf
#
# Replaces ~/.config/sway/scripts/lock.sh + swaylock. That script grabbed a
# grim screenshot per output, pixelated it with ImageMagick and stamped
# "sod off" on it; hyprlock does the screenshot + obscuring itself, so the
# whole script collapses into this config. (hyprlock has no pixelate filter,
# so the blur below is the closest equivalent to the 5%/2000% scale trick.)
#
# Only Solarized accents that are identical in both light and dark are used,
# so the lock screen doesn't need to follow the theme toggle.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    brightness = 0.7
    contrast = 0.9
}

label {
    monitor =
    text = sod off
    color = rgb(268bd2)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(93a1a1)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 340, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgb(268bd2)
    inner_color = rgba(002b36cc)
    font_color = rgb(93a1a1)
    font_family = JetBrainsMono Nerd Font
    check_color = rgb(859900)
    fail_color = rgb(dc322f)
    fade_on_empty = false
    placeholder_text = <i>password</i>
    position = 0, -40
    halign = center
    valign = center
}
