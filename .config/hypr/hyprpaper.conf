# ~/.config/hypr/hyprpaper.conf
# Equivalent of sway's `output * bg ~/wallpaper.jpg fill`.
# hyprpaper is started from hyprland.lua's `hyprland.start` handler.

splash = false
ipc = true

wallpaper {
    # empty monitor = fallback for every output
    monitor =
    path = ~/wallpaper.jpg
    # `cover` is hyprpaper's name for sway's `fill`
    fit_mode = cover
}
