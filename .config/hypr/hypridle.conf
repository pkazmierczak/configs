# ~/.config/hypr/hypridle.conf
#
# Replaces the swayidle block from ~/.config/sway/config:
#
#   timeout 300 lock.sh
#   timeout 600 'output * power off' / resume 'output * power on'
#   before-sleep lock.sh
#
# Locking goes through logind so that this, the $mod+Escape bind and the lid
# switch all converge on a single hyprlock instance.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Re-enable the outputs on wake, otherwise the first keypress is eaten
    # just turning the display back on.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
